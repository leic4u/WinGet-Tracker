name: WinGet Tracker

env:
  ACTIONS_STEP_DEBUG: true

on:
  # 1. 允许外部通过 cron-job.org 精准触发
  repository_dispatch:
    types: [trigger-tracker]
  schedule:
    - cron: "37 4,10,16,22 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Sync winget-pkgs fork with upstream
        shell: pwsh
        run: |
          ./scripts/sync-winget-fork.ps1
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      - name: Install dependencies
        shell: pwsh
        run: |
          Install-Module powershell-yaml -Scope CurrentUser -Force
          winget install RussellBanks.Komac --source winget --accept-source-agreements --accept-package-agreements

      - name: Check versions
        shell: pwsh
        run: |
          ./scripts/check-version.ps1

      - name: Submit updates
        shell: pwsh
        run: |
          ./scripts/submit-winget.ps1
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          ACTIONS_STEP_DEBUG: true

      - name: Cleanup merged PR branches
        shell: pwsh
        run: |
          ./scripts/cleanup-merged-prs.ps1
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          ACTIONS_STEP_DEBUG: true

      # 无论前面的步骤是否成功，只要检测到更新就发送 Telegram 通知
      - name: Send Telegram notification
        if: always()
        shell: pwsh
        run: |
          ./scripts/send-telegram-notification.ps1
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_USER: ${{ secrets.TG_USER }}

